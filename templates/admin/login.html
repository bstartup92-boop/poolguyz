{% extends "admin/base.html" %}
{% block title %}Admin login{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-card">
    <a class="admin-logo" href="{{ url_for('home') }}"><img class="admin-brand-image" src="{{ url_for('static', filename='images/poolguyz-logo-transparent.png') }}" alt="Pool Guyz Swimming Pool System"></a>
    <p class="eyebrow">Website admin</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to update the website.</p>
    {% include "admin/flash.html" %}
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Password <input type="password" name="password" required autocomplete="current-password" autofocus></label>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    <a class="back-link" href="{{ url_for('home') }}">← Back to website</a>
  </section>
</main>
{% endblock %}
